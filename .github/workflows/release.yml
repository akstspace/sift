name: Version bump and release
run-name: Release / ${{ inputs.bump }} bump
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable semantic version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      confirm:
        description: Type akstspace/sift to authorize commit, tag, and publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require official repository and main branch
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REPOSITORY" = akstspace/sift
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM" = akstspace/sift

  verify:
    needs: authorize
    uses: ./.github/workflows/ci.yml
    with:
      bump: ${{ inputs.bump }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: .cache/release-assets
      - name: Bump exactly the tested source and generate checksums
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 scripts/version.py --bump "$BUMP"
          python3 scripts/publish-release.py prepare
      - name: Commit, atomically push branch/tag, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py publish
