name: Version bump and release
run-name: Release / ${{ inputs.bump }} bump
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable semantic version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      confirm:
        description: Type akstspace/sift to authorize commit, tag, and publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require official repository and main branch
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REPOSITORY" = akstspace/sift
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM" = akstspace/sift

  verify:
    needs: authorize
    uses: ./.github/workflows/ci.yml
    with:
      bump: ${{ inputs.bump }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: .cache/release-assets
      - name: Bump exactly the tested source and generate checksums
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 scripts/version.py --bump "$BUMP"
          python3 scripts/publish-release.py prepare
      - name: Commit, atomically push branch/tag, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py publish
